<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rock texture gradient -->
    <linearGradient id="rock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a4a52;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#35353d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#25252b;stop-opacity:1" />
    </linearGradient>

    <!-- Iron ore vein -->
    <linearGradient id="ironVein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7a6f5d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#5d534a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d342e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="32" cy="56" rx="24" ry="4" fill="#000000" opacity="0.2"/>

  <!-- Rock base -->
  <path d="M 32 16 L 52 28 L 50 48 L 32 56 L 14 48 L 12 28 Z"
        fill="url(#rock)"
        stroke="#1a1a1f"
        stroke-width="1.5"/>

  <!-- Rock facets for realism -->
  <path d="M 32 16 L 32 56" stroke="#25252b" stroke-width="1" opacity="0.5"/>
  <path d="M 12 28 L 50 48" stroke="#25252b" stroke-width="0.8" opacity="0.4"/>
  <path d="M 52 28 L 14 48" stroke="#25252b" stroke-width="0.8" opacity="0.4"/>
  <path d="M 22 22 L 42 44" stroke="#25252b" stroke-width="0.6" opacity="0.3"/>

  <!-- Iron ore veins -->
  <ellipse cx="28" cy="30" rx="4" ry="6" fill="url(#ironVein)" stroke="#3d342e" stroke-width="0.8" opacity="0.9"/>
  <ellipse cx="38" cy="35" rx="5" ry="7" fill="url(#ironVein)" stroke="#3d342e" stroke-width="0.8" opacity="0.9"/>
  <ellipse cx="32" cy="44" rx="3" ry="5" fill="url(#ironVein)" stroke="#3d342e" stroke-width="0.8" opacity="0.85"/>
  <ellipse cx="20" cy="40" rx="2.5" ry="4" fill="url(#ironVein)" stroke="#3d342e" stroke-width="0.6" opacity="0.8"/>

  <!-- Metallic ore specks -->
  <circle cx="26" cy="28" r="1" fill="#9b8a6f" opacity="0.6"/>
  <circle cx="30" cy="33" r="0.8" fill="#9b8a6f" opacity="0.5"/>
  <circle cx="36" cy="32" r="1.2" fill="#9b8a6f" opacity="0.7"/>
  <circle cx="40" cy="38" r="0.9" fill="#9b8a6f" opacity="0.6"/>
  <circle cx="33" cy="46" r="0.7" fill="#9b8a6f" opacity="0.5"/>

  <!-- Rock texture - cracks and roughness -->
  <path d="M 18 32 Q 20 34 22 36" stroke="#1a1a1f" stroke-width="0.5" fill="none" opacity="0.5"/>
  <path d="M 42 30 Q 44 34 46 38" stroke="#1a1a1f" stroke-width="0.5" fill="none" opacity="0.5"/>
  <path d="M 28 48 L 32 50" stroke="#1a1a1f" stroke-width="0.4" opacity="0.4"/>

  <!-- Highlight on top edge -->
  <path d="M 32 16 L 40 22 L 32 28" fill="#5a5a62" opacity="0.3"/>
</svg>
