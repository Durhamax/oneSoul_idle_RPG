<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Crystal gradient -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>

    <!-- Rock gradient -->
    <linearGradient id="rockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6b7280;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>

    <!-- Glow -->
    <radialGradient id="crystalGlow">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.6" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Base rock formation -->
  <ellipse cx="32" cy="50" rx="28" ry="10" fill="#1f2937" opacity="0.3"/>
  <path d="M 10 45 L 8 52 L 18 54 L 15 45 Z" fill="url(#rockGrad)" stroke="#1f2937" stroke-width="1"/>
  <path d="M 48 45 L 50 52 L 56 50 L 52 45 Z" fill="url(#rockGrad)" stroke="#1f2937" stroke-width="1"/>
  <path d="M 20 48 L 15 55 L 25 56 L 24 48 Z" fill="url(#rockGrad)" stroke="#1f2937" stroke-width="1"/>
  <path d="M 38 48 L 40 56 L 48 54 L 44 48 Z" fill="url(#rockGrad)" stroke="#1f2937" stroke-width="1"/>

  <!-- Center large crystal -->
  <path d="M 32 10 L 38 25 L 35 40 L 29 40 L 26 25 Z" fill="url(#crystalGrad)" stroke="#6d28d9" stroke-width="1.5" opacity="0.95"/>
  <path d="M 32 10 L 35 40" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>
  <path d="M 32 10 L 29 40" stroke="#ffffff" stroke-width="0.5" opacity="0.4"/>

  <!-- Left crystal -->
  <path d="M 18 20 L 22 30 L 20 42 L 16 42 L 14 30 Z" fill="url(#crystalGrad)" stroke="#6d28d9" stroke-width="1" opacity="0.9"/>
  <path d="M 18 20 L 20 42" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>

  <!-- Right crystal -->
  <path d="M 46 18 L 50 28 L 48 40 L 44 40 L 42 28 Z" fill="url(#crystalGrad)" stroke="#6d28d9" stroke-width="1" opacity="0.9"/>
  <path d="M 46 18 L 48 40" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>

  <!-- Small crystal accents -->
  <path d="M 25 35 L 27 38 L 26 44 L 24 44 L 23 38 Z" fill="url(#crystalGrad)" stroke="#6d28d9" stroke-width="0.8" opacity="0.85"/>
  <path d="M 38 33 L 40 37 L 39 43 L 37 43 L 36 37 Z" fill="url(#crystalGrad)" stroke="#6d28d9" stroke-width="0.8" opacity="0.85"/>

  <!-- Glow effects -->
  <ellipse cx="32" cy="25" rx="12" ry="20" fill="url(#crystalGlow)" opacity="0.4">
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Sparkle particles -->
  <circle cx="28" cy="18" r="1" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="36" cy="22" r="0.8" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="30" cy="32" r="0.8" fill="#ffffff" opacity="0.8">
    <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite" begin="1s"/>
  </circle>
</svg>
