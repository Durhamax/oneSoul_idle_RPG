<!DOCTYPE html>
<html>
<head>
    <title>Click Diagnosis</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a1a;
            color: white;
        }
        #output {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            background: #4a9eff;
            border: none;
            border-radius: 4px;
            color: white;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #6ac3ff;
        }
    </style>
</head>
<body>
    <h1>Click Diagnosis Tool</h1>
    <p>Click the button below. If it works here but not in the game, there's a blocking element in the game.</p>

    <button onclick="testClick('Test Button 1')">Click Me - Test 1</button>
    <button onclick="testClick('Test Button 2')">Click Me - Test 2</button>
    <button onclick="testClick('Test Button 3')">Click Me - Test 3</button>

    <button onclick="openGame()">Open Game in New Tab</button>

    <div id="output"></div>

    <script>
        let clickCount = 0;

        function testClick(buttonName) {
            clickCount++;
            const output = document.getElementById('output');
            const time = new Date().toLocaleTimeString();
            output.innerHTML = `<div style="color: #4caf50; margin-bottom: 10px;">✅ Click #${clickCount} - ${buttonName} at ${time}</div>` + output.innerHTML;
        }

        function openGame() {
            window.open('index.html', '_blank');
            const output = document.getElementById('output');
            output.innerHTML = `<div style="color: #4a9eff; margin-bottom: 10px;">🔗 Game opened in new tab</div>` + output.innerHTML;
        }

        // Log any element that might be blocking
        document.addEventListener('click', function(e) {
            const output = document.getElementById('output');
            const target = e.target;
            const computedStyle = window.getComputedStyle(target);
            output.innerHTML += `<div style="font-size: 12px; color: #888; margin-bottom: 5px;">
                Clicked: ${target.tagName} |
                pointer-events: ${computedStyle.pointerEvents} |
                z-index: ${computedStyle.zIndex}
            </div>`;
        });
    </script>
</body>
</html>
